<!doctype html>
<!-- Source of assets/og.jpg (1200×630 link preview). Render: open at 1200×630 and screenshot. -->
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "EB Garamond";
        font-style: normal;
        font-weight: 400 800;
        font-display: swap;
        src: url(../assets/fonts/eb-garamond-normal-vietnamese.woff2) format("woff2");
        unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301,
          U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;
      }
      @font-face {
        font-family: "EB Garamond";
        font-style: normal;
        font-weight: 400 800;
        font-display: swap;
        src: url(../assets/fonts/eb-garamond-normal-latin.woff2) format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329,
          U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "EB Garamond";
        font-style: italic;
        font-weight: 400;
        font-display: swap;
        src: url(../assets/fonts/eb-garamond-italic-vietnamese.woff2) format("woff2");
        unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301,
          U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;
      }
      @font-face {
        font-family: "EB Garamond";
        font-style: italic;
        font-weight: 400;
        font-display: swap;
        src: url(../assets/fonts/eb-garamond-italic-latin.woff2) format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329,
          U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      :root {
        --ink: #2f241c;
        --ink-soft: #6e5a4a;
        --wine: #6e1a26;
        --gold-ink: #85622f;
        --serif: "EB Garamond", Georgia, serif;
        --shadow: drop-shadow(0.5px 1px 0.5px rgb(30 20 12 / 0.35)) drop-shadow(1px 4px 5px rgb(30 20 12 / 0.22))
          drop-shadow(4px 18px 24px rgb(30 20 12 / 0.3));
      }
      * { box-sizing: border-box; }
      body {
        position: relative;
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
        color: var(--ink);
        font-family: var(--serif);
        background:
          radial-gradient(ellipse at 50% 45%, transparent 40%, rgb(40 28 18 / 0.22) 100%),
          linear-gradient(rgb(60 44 30 / 0.12), rgb(60 44 30 / 0.12)),
          #d8ccb8 url(../assets/linen.webp) center / cover;
      }
      img { display: block; }
      /* The open envelope as on page 1: back with the flap up, the card pulled out, then the front pocket. */
      .envelope {
        position: absolute;
        left: 260px;
        top: 178px;
        width: 680px;
        scale: 0.8;
        transform-origin: 50% 0;
        aspect-ratio: 900 / 670;
      }
      .envelope > * { position: absolute; left: 0; width: 100%; }
      .envelope .back,
      .envelope .pocket { top: 0; transform: translateY(-39.55%); }
      .envelope .back { filter: brightness(1.04) contrast(1.02) var(--shadow); }
      .envelope .pocket { filter: brightness(1.04) contrast(1.02); }
      .card {
        left: 6%;
        width: 88%;
        top: -140px;
        aspect-ratio: 1396 / 1000;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-top: 32px;
        text-align: center;
        isolation: isolate;
        text-shadow: 0 1px 0 rgb(255 255 255 / 0.75);
      }
      .card::before {
        content: "";
        position: absolute;
        inset: -12% -8.6%;
        z-index: -1;
        background: url(../assets/card-landscape-sheet.webp) center / 100% 100% no-repeat;
      }
      .caps { font-size: 19px; letter-spacing: 0.3em; text-transform: uppercase; }
      .kicker { color: var(--gold-ink); }
      .names { margin: 10px 0 0; font: 400 54px/1.05 var(--serif); }
      .amp { color: var(--wine); font-style: italic; }
      .rule { width: 60px; height: 1px; margin: 20px 0; background: var(--gold-ink); opacity: 0.6; }
      .when { margin: 0; font-size: 29px; letter-spacing: 0.04em; }
      .where { margin: 8px 0 0; font-size: 22px; color: var(--ink-soft); }
    </style>
  </head>
  <body>
    <div class="envelope">
      <img class="back" src="../assets/envelope-open.webp" alt="" />
      <div class="card">
        <span class="caps kicker">Lễ thành hôn</span>
        <p class="names">Khánh Linh <span class="amp">&amp;</span> Xuân Đạt</p>
        <span class="rule"></span>
        <p class="when">Thứ Ba · 24.11.2026 · 11:00</p>
        <p class="where">Trung tâm tổ chức sự kiện Âu Cơ, Hải Phòng</p>
      </div>
      <img class="pocket" src="../assets/envelope-pocket.webp" alt="" />
    </div>
  </body>
</html>
